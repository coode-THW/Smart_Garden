# ============================================================================
# 智慧花园 — Nginx 站点配置（Phase 2 · Day53-54）
# ============================================================================
#
# 用途：为 APP 的知识库在线更新提供静态文件服务。
#   静态根目录   /var/www/smart-garden
#     └── care/
#         ├── version.json      清单（APP 启动时拉取）
#         └── {花名}.json        56 份养护数据
#
# 部署方式（Debian/Ubuntu）：
#   1. 把本文件放到 /etc/nginx/sites-available/smart-garden
#   2. ln -s /etc/nginx/sites-available/smart-garden /etc/nginx/sites-enabled/
#   3. 替换下面所有 YOUR_DOMAIN 与证书路径
#   4. nginx -t && systemctl reload nginx
#
# ⚠️ 本配置**未经 nginx -t 实测**（生成它的环境里没有 nginx）。
#    上线前务必先跑 nginx -t。
#
# 静态文件由 scripts/generate_manifest.py 生成后上传到静态根目录。
# ============================================================================


# ────────────────────────────────────────────────────────────────────────────
# HTTP：只用来跳转 HTTPS，以及给 Let's Encrypt 续期留验证入口
# ────────────────────────────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name YOUR_DOMAIN;

    # 证书续期时 ACME 校验走这里。注意必须在跳转规则**之前**匹配，
    # 否则校验请求会被 301 到 HTTPS，续期失败。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ────────────────────────────────────────────────────────────────────────────
# HTTPS：知识库静态文件
# ────────────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name YOUR_DOMAIN;

    # nginx ≥ 1.25.1 用 `http2 on;`。
    # 更老的版本要写成 `listen 443 ssl http2;` —— 写错会导致 nginx -t 直接报错。
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    root  /var/www/smart-garden;
    index index.html;

    # 花名与养护内容都是中文。缺了 charset 会让部分客户端按 latin-1 解码成乱码。
    charset utf-8;

    # 养护数据是 JSON，压缩后能省掉大约 3/4 流量
    gzip            on;
    gzip_types      application/json;
    gzip_min_length 1024;

    # ⚠️ add_header 不会从上层继承：只要某个 location 里出现了自己的 add_header，
    #    本 server 块的 add_header 在那个 location 里就**全部失效**。
    #    所以每个 location 都要把需要的头写全 —— 下面每个 location 都重复了一遍。
    #    （这是 nginx 最著名的坑之一，漏了会导致 HSTS 静默消失。）

    # ── 清单：绝不能缓存 ──
    # APP 靠定时拉它来判断「有没有新版」。一旦被缓存，用户会在缓存过期前
    # 完全收不到更新通知，且现象是「有的用户更新了、有的没有」——极难排查。
    location = /care/version.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ── 养护数据：短缓存 ──
    # 这些文件的**文件名不随内容变化**（玫瑰.json 永远是玫瑰.json），
    # 所以不能用 immutable 长缓存：内容更新后客户端会一直拿到旧文件。
    # 用 max-age=300 + ETag 让客户端 5 分钟内复用、之后回源校验。
    #
    # 若以后想改成长期缓存，需要把文件名也带上内容哈希
    # （version.json 里出 "玫瑰.<hash>.json" 这样的 url，键仍是 "玫瑰.json"），
    # 那样才安全 —— 但那要同步改生成器和客户端，当前不值得。
    location /care/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        try_files $uri =404;
    }

    # 这个域名只提供知识库更新，其他路径一律 404，不暴露任何别的东西
    location / {
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 404;
    }
}
